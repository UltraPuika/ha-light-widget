name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (API client, brightness, sync rules)
        run: ./gradlew --no-daemon :core:test

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Android lint (report only)
        continue-on-error: true
        run: ./gradlew --no-daemon :app:lintDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            core/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ha-light-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as GitHub Release (direct download link)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ha-light.apk
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest ha-light.apk \
            --target "$GITHUB_SHA" \
            --title "HA Light – latest build" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Download ha-light.apk on your Android 12+ phone and open it to install."
